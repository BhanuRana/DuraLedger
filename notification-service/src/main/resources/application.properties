spring.application.name=notification-service
server.port=8081

# No profile given -> "local": the Pub/Sub emulator (application-local.properties).
spring.profiles.default=local

# The same shared containers as ledger-service. start-only: with two services sharing them, one
# service stopping must not stop Postgres under the other.
spring.docker.compose.file=../docker-compose.yml
spring.docker.compose.lifecycle-management=start-only

# Service boundary: this service owns the `notification` schema and never touches ledger-service's
# tables; its only input is the ledger.events stream. Its own Flyway history table too.
spring.flyway.schemas=notification
spring.flyway.default-schema=notification

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
spring.mvc.problemdetails.enabled=true

duraledger.events.topic=ledger.events
duraledger.events.subscription=notification-service.ledger-events

# pull: a streaming-pull subscriber (local, any always-on host). push: Pub/Sub POSTs each event to
# /pubsub/push with an OIDC token (Cloud Run, where nothing may hold a connection between requests).
duraledger.events.delivery=pull

# Metrics push over OTLP. Off unless an environment opts in, so tests and the kind cluster never dial
# localhost:4318: the compose `app` profile pushes to the local otel-lgtm, gcp to Grafana Cloud.
management.otlp.metrics.export.enabled=false
management.otlp.metrics.export.step=30s
management.opentelemetry.resource-attributes[deployment.environment.name]=${DURALEDGER_ENV:local}
# One id per process. Without it every replica pushes the same series and they overwrite each other
# (counters flip-flop and rate() reads resets). Random, not HOSTNAME: Cloud Run doesn't promise a unique one.
management.opentelemetry.resource-attributes[service.instance.id]=${random.uuid}
# Latency as a few SLO buckets, not a full histogram: about 7 series per uri and status instead of 70,
# which keeps the whole system well inside Grafana Cloud's free 10k active series.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2500ms

# Fail fast when the database is unreachable. Hikari's default 30 s wait for a connection made every
# request hang that long before its 500, holding a server thread throughout (found by making the
# HighServerErrorRate alert fire). In ms: Hikari binds a plain long. gcp raises it for Neon's wake-up.
spring.datasource.hikari.connection-timeout=3000
