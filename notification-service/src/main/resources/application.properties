spring.application.name=notification-service
server.port=8081

# No profile given -> "local": the Pub/Sub emulator (application-local.properties).
spring.profiles.default=local

# The same shared containers as ledger-service. start-only: with two services sharing them, one
# service stopping must not stop Postgres under the other.
spring.docker.compose.file=../docker-compose.yml
spring.docker.compose.lifecycle-management=start-only

# Service boundary: this service owns the `notification` schema and never touches ledger-service's
# tables; its only input is the ledger.events stream. Its own Flyway history table too.
spring.flyway.schemas=notification
spring.flyway.default-schema=notification

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
spring.mvc.problemdetails.enabled=true

duraledger.events.topic=ledger.events
duraledger.events.subscription=notification-service.ledger-events

# pull: a streaming-pull subscriber (local, any always-on host). push: Pub/Sub POSTs each event to
# /pubsub/push with an OIDC token (Cloud Run, where nothing may hold a connection between requests).
duraledger.events.delivery=pull
