# Local development and tests: the Pub/Sub emulator from ../docker-compose.yml (tests override the host).
spring.cloud.gcp.project-id=duraledger-local
spring.cloud.gcp.pubsub.emulator-host=localhost:8085
duraledger.events.create-topology=true
logging.level.com.google.cloud.spring.core.DefaultCredentialsProvider=ERROR
# Local dev and tests: a fixed, non-secret key (demo.sh sends it by default). In GCP the keys come
# from Secret Manager; with none configured the API refuses everything (fail closed).
duraledger.api.keys=local-dev-key
