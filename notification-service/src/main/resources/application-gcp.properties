# Cloud Run (SPRING_PROFILES_ACTIVE=gcp). See ledger-service's application-gcp.properties.
server.port=${PORT:8080}

# Pub/Sub pushes each event to /pubsub/push; nothing holds a streaming pull open.
duraledger.events.delivery=push

spring.flyway.enabled=false
spring.datasource.hikari.maximum-pool-size=3
# Neon suspends idle compute; waking it can take a few seconds and must not read as an outage.
spring.datasource.hikari.connection-timeout=10000

management.endpoints.web.exposure.include=health,info
