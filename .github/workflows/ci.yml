name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test ledger-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledger-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ledger-service/pom.xml
      # Tests start real Postgres containers through Testcontainers; the runner has Docker.
      - run: ./mvnw -B -ntp verify
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: ledger-service/target/surefire-reports
