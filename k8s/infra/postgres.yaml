apiVersion: apps/v1
kind: StatefulSet            # stable identity + its own volume: the standard shape for a database
metadata: { name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine          # same major version as production (Neon)
          env:
            - { name: POSTGRES_DB, value: duraledger }
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: duraledger-secrets, key: db-username } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: duraledger-secrets, key: db-password } } }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: [sh, -c, "pg_isready -U duraledger -d duraledger"] }
            periodSeconds: 2
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
