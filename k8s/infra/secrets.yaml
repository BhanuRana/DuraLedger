# DEV-ONLY values for the local kind cluster (same non-secrets as docker-compose). In a real cluster
# this object would be synced from GCP Secret Manager (External Secrets Operator), never committed.
apiVersion: v1
kind: Secret
metadata: { name: duraledger-secrets }
type: Opaque
stringData:
  db-username: duraledger
  db-password: local-only-password
  api-key: local-dev-key
