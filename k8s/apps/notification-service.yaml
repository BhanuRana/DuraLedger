apiVersion: apps/v1
kind: Deployment
metadata: { name: notification-service }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app: notification-service } }
  template:
    metadata: { labels: { app: notification-service } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: duraledger/notification-service:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8081 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: local }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/duraledger" }
            - { name: SPRING_DATASOURCE_USERNAME, valueFrom: { secretKeyRef: { name: duraledger-secrets, key: db-username } } }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: duraledger-secrets, key: db-password } } }
            - { name: DURALEDGER_API_KEYS, valueFrom: { secretKeyRef: { name: duraledger-secrets, key: api-key } } }
            - { name: SPRING_CLOUD_GCP_PUBSUB_EMULATOR_HOST, value: "pubsub:8085" }
            - { name: SPRING_FLYWAY_ENABLED, value: "false" }
            - { name: SERVER_SHUTDOWN, value: graceful }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 512Mi }
          startupProbe:   { httpGet: { path: /actuator/health/liveness, port: 8081 }, periodSeconds: 2, failureThreshold: 60 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness, port: 8081 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8081 }, periodSeconds: 2 }
          lifecycle: { preStop: { exec: { command: [sleep, "5"] } } }
---
apiVersion: v1
kind: Service
metadata: { name: notification-service }
spec:
  type: NodePort
  selector: { app: notification-service }
  ports: [{ port: 8081, targetPort: 8081, nodePort: 30081 }]
