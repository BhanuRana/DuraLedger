apiVersion: apps/v1
kind: Deployment
metadata: { name: ledger-service }
spec:
  replicas: 2                      # two relays share the outbox via FOR UPDATE SKIP LOCKED
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # never below 2 ready pods during a rollout
  selector: { matchLabels: { app: ledger-service } }
  template:
    metadata: { labels: { app: ledger-service } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: duraledger/ledger-service:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            # Always-on pods: in-process timers + streaming pull (Cloud Run uses Scheduler + push instead)
            - { name: SPRING_PROFILES_ACTIVE, value: local }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/duraledger" }
            - { name: SPRING_DATASOURCE_USERNAME, valueFrom: { secretKeyRef: { name: duraledger-secrets, key: db-username } } }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: duraledger-secrets, key: db-password } } }
            - { name: DURALEDGER_API_KEYS, valueFrom: { secretKeyRef: { name: duraledger-secrets, key: api-key } } }
            - { name: SPRING_CLOUD_GCP_PUBSUB_EMULATOR_HOST, value: "pubsub:8085" }
            - { name: SPRING_FLYWAY_ENABLED, value: "false" }      # the migrate Job owns the schema
            - { name: SERVER_SHUTDOWN, value: graceful }
          # Heap = 75% of THIS limit (JAVA_TOOL_OPTIONS in the image), leaving room for metaspace,
          # threads and direct buffers. No CPU limit on purpose: CFS throttling stalls the JVM (GC,
          # JIT); the CPU request still guarantees a fair share.
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 768Mi }
          # Spring Boot exposes these groups automatically when it detects Kubernetes.
          startupProbe:   { httpGet: { path: /actuator/health/liveness, port: 8080 }, periodSeconds: 2, failureThreshold: 60 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness, port: 8080 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, periodSeconds: 2 }
          lifecycle:
            # Removing the pod from the Service's endpoints and sending SIGTERM happen in parallel.
            # Sleeping first lets kube-proxy stop routing here before Spring stops accepting
            # connections; without it, a rollout dropped about 3% of requests.
            preStop: { exec: { command: [sleep, "5"] } }
---
apiVersion: v1
kind: Service
metadata: { name: ledger-service }
spec:
  type: NodePort
  selector: { app: ledger-service }
  ports: [{ port: 8080, targetPort: 8080, nodePort: 30080 }]
