spring.application.name=ledger-service

# No profile given -> "local": the Pub/Sub emulator (application-local.properties). A real deployment
# sets its own profile, so emulator settings can never leak into it.
spring.profiles.default=local

# The compose file lives at the repo root because later services share the same Postgres.
# Spring Boot's Docker Compose support starts it on `./mvnw spring-boot:run` and wires the
# DataSource from the running container: no datasource URL, user or password in this file.
spring.docker.compose.file=../docker-compose.yml
# start-only: both services share these containers. Boot's default stops them when the app stops,
# which took Postgres down under notification-service.
spring.docker.compose.lifecycle-management=start-only

management.endpoints.web.exposure.include=health,info,prometheus,reconciliation
# Local only: show which components are UP. A public deployment would use when-authorized.
management.endpoint.health.show-details=always

# jOOQ renders Postgres-specific SQL (RETURNING, FOR UPDATE, ...)
spring.jooq.sql-dialect=postgres
# RFC 9457 problem+json for Spring's own errors too (validation, missing body), matching ours
spring.mvc.problemdetails.enabled=true

# PESSIMISTIC (SELECT ... FOR UPDATE) or OPTIMISTIC (version compare-and-set + retry)
duraledger.transfer.locking=pessimistic
duraledger.transfer.max-optimistic-attempts=16

# Graceful shutdown: let an in-flight relay tick finish before its dependencies close.
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=10s

duraledger.outbox.topic=ledger.events
duraledger.outbox.poll-interval=200ms

# Reconciliation: whole-ledger invariant checks
duraledger.reconciliation.interval=60s
duraledger.reconciliation.initial-delay=30s

# internal: in-process timers (local, tests, any always-on host). external: Cloud Scheduler calls
# /internal/tasks/* with an OIDC token (Cloud Run, which has no CPU between requests).
duraledger.tasks.trigger=internal

# Static FX rates, units per 1 USD (no live market data). Each conversion stores the rate it used.
duraledger.fx.units-per-usd[USD]=1
duraledger.fx.units-per-usd[HKD]=7.80
duraledger.fx.units-per-usd[EUR]=0.92
duraledger.fx.units-per-usd[GBP]=0.79

# Metrics push over OTLP. Off unless an environment opts in, so tests and the kind cluster never dial
# localhost:4318: the compose `app` profile pushes to the local otel-lgtm, gcp to Grafana Cloud.
management.otlp.metrics.export.enabled=false
management.otlp.metrics.export.step=30s
management.opentelemetry.resource-attributes[deployment.environment.name]=${DURALEDGER_ENV:local}
# One id per process. Without it every replica pushes the same series and they overwrite each other
# (counters flip-flop and rate() reads resets). Random, not HOSTNAME: Cloud Run doesn't promise a unique one.
management.opentelemetry.resource-attributes[service.instance.id]=${random.uuid}
# Latency as a few SLO buckets, not a full histogram: about 7 series per uri and status instead of 70,
# which keeps the whole system well inside Grafana Cloud's free 10k active series.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2500ms
