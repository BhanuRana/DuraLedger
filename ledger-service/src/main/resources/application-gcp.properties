# Cloud Run (SPRING_PROFILES_ACTIVE=gcp). Database credentials arrive as env vars from Secret Manager
# (--set-secrets); the project id comes from the metadata server. See infra/gcp/deploy.sh.
server.port=${PORT:8080}

# No always-on CPU: Cloud Scheduler calls /internal/tasks/*, and events publish right after commit.
duraledger.tasks.trigger=external
duraledger.outbox.publish-after-commit=true

# Migrations run as a Cloud Run Job before the new revision takes traffic (infra/gcp/deploy.sh):
# shorter cold starts, and several instances never race to migrate.
spring.flyway.enabled=false

# Neon free tier and at most 2 instances: keep connections few.
spring.datasource.hikari.maximum-pool-size=4
# Neon suspends idle compute; waking it can take a few seconds and must not read as an outage.
spring.datasource.hikari.connection-timeout=10000

# Publicly reachable: only health and info over HTTP. On-demand reconciliation is the OIDC-protected
# /internal/tasks/reconcile, not an open actuator endpoint.
management.endpoints.web.exposure.include=health,info

# DURALEDGER_API_KEYS comes from Secret Manager (api-key). 120 a minute per key per instance.
duraledger.api.rate-limit-per-minute=120
