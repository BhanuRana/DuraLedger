# Local infrastructure, shared by every service in this repo (hence the root, not inside a service).
# Spring Boot's Docker Compose support starts it on `./mvnw spring-boot:run`; `docker compose up -d` works too.
# `docker compose --profile app up --build` also runs both services from their images (build the jars first).
services:
  postgres:
    # 18 = what production (Neon) runs; tests and jOOQ codegen pin the same version.
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: duraledger
      POSTGRES_USER: duraledger
      POSTGRES_PASSWORD: local-only-password
    ports: ["5432:5432"]
    # The 18 image keeps data in a versioned subdirectory, so mount the parent. A new volume, because an
    # 18 server can't open a 16 data directory.
    volumes: ["postgres18-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duraledger -d duraledger"]
      interval: 2s
      retries: 30

  # GCP Pub/Sub emulator: ledger events are published here locally (no GCP account needed).
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=duraledger-local
    ports: ["8085:8085"]

  # Local stand-in for Grafana Cloud: an OpenTelemetry collector, Prometheus and Grafana in one
  # container, receiving the same OTLP pushes production sends. Grafana: http://localhost:3000.
  # Also usable on its own: `docker compose --profile obs up -d`, then run a service with
  # MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=true.
  lgtm:
    profiles: ["app", "obs"]
    image: grafana/otel-lgtm:latest
    ports: ["3000:3000", "4318:4318"]

  # --- the services themselves, from their images ------------------------------------------
  # The packaged jar has no Docker Compose support (Spring Boot leaves it out of production jars),
  # so connection details come from environment variables, as they will in any real deployment.
  ledger-service:
    profiles: ["app"]
    build: ./ledger-service
    ports: ["8080:8080"]
    environment: &app-env
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/duraledger
      SPRING_DATASOURCE_USERNAME: duraledger
      SPRING_DATASOURCE_PASSWORD: local-only-password
      SPRING_CLOUD_GCP_PUBSUB_EMULATOR_HOST: pubsub:8085
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://lgtm:4318/v1/metrics
    mem_limit: 768m   # on purpose: the heap is sized from this limit, not from the host's RAM
    depends_on:
      postgres: { condition: service_healthy }
      pubsub: { condition: service_started }
      lgtm: { condition: service_started }
  notification-service:
    profiles: ["app"]
    build: ./notification-service
    ports: ["8081:8081"]
    environment: *app-env
    mem_limit: 512m
    depends_on:
      postgres: { condition: service_healthy }
      pubsub: { condition: service_started }
      lgtm: { condition: service_started }

volumes:
  postgres18-data:
